<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — WhoCalls Minimal</title>
<style>
  :root{--bg:#f7f7f8;--card:#ffffff;--text:#1b1d21;--muted:#5a5f68;--border:#e4e5e8;--accent:#2f6fed;--accent-ink:#ffffff;}
  @media (prefers-color-scheme: dark){:root{--bg:#14161a;--card:#1c1f25;--text:#eef0f3;--muted:#a7acb6;--border:#2b2f36;--accent:#5b8cff;--accent-ink:#0b1020;}}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:520px;margin:0 auto;padding:48px 20px;text-align:center;}
  h1{font-size:64px;margin:0;color:var(--accent);}
  p{color:var(--muted);font-size:16px;}
  a.btn{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>The page you are looking for could not be found.</p>
    <a class="btn" href="/whocalls-minimal/">Back to Legal &amp; Policies</a>
  </div>
</body>
</html>
